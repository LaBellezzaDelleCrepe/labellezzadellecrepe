<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il mio scrittoio | La bellezza delle crepe</title>
<link href="https://fonts.googleapis.com/css2?family=Italianno&family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--cielo:#CEDDE4;--carta:#f8f4ec;--inchiostro:#66544d;--bordo:#d6d0c9}
*{box-sizing:border-box}
body{margin:0;background:var(--cielo);color:var(--inchiostro);font-family:"Cormorant Garamond",serif}
header{text-align:center;padding:40px 15px 20px}
header h1{font-family:Italianno,cursive;font-weight:400;font-size:clamp(55px,9vw,85px);margin:0}
header p{font-size:22px;font-style:italic;margin:0}
main{max-width:850px;margin:25px auto 70px;padding:0 18px}
.foglio{background:var(--carta);padding:clamp(22px,5vw,55px);border:1px solid rgba(255,255,255,.8);border-radius:12px;box-shadow:0 8px 30px #526b781c}
h2{text-align:center;font-size:40px;font-weight:400;margin:0}
.fiore{text-align:center;font-size:23px;margin:10px 0 30px;color:#89977d}
label{display:block;margin:22px 0 8px;font-size:23px}
input,select,textarea{width:100%;background:#fffdf9;border:1px solid var(--bordo);border-radius:7px;padding:13px;color:var(--inchiostro);font:21px "Cormorant Garamond",serif}
textarea{min-height:340px;resize:vertical;line-height:1.6}
input:focus,textarea:focus,select:focus{outline:2px solid #a6b9c2}
.pulsanti{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
button{flex:1;min-width:140px;padding:13px;border-radius:9px;border:1px solid #b8cbd4;background:#e1eaf0;color:var(--inchiostro);font:20px "Cormorant Garamond",serif;cursor:pointer}
button:hover{background:#edf3f6}
.nota{text-align:center;font-size:17px;font-style:italic;margin-top:25px}
footer{text-align:center;padding:20px;font-size:18px}
</style>
</head>
<body>
<header>
<h1>La bellezza delle crepe</h1>
<p>Un piccolo angolo per le parole che desiderano nascere.</p>
</header>
<main>
<section class="foglio">
<h2>Il mio scrittoio</h2>
<div class="fiore">✧ ❀ ✧</div>
<label for="titolo">Titolo del pensiero</label>
<input id="titolo" placeholder="Un titolo da ricordare...">
<label for="categoria">Categoria</label>
<select id="categoria">
<option>Pensieri</option><option>Emozioni</option><option>Vita quotidiana</option><option>Società</option><option>Riflessioni</option>
</select>
<label for="copertina">Immagine di copertina</label>
<input id="copertina" type="file" accept="image/png,image/jpeg,image/webp">
<div id="copertinaPreview" style="margin-top:15px"></div>

<label for="testo">Le tue parole</label>
<textarea id="testo" placeholder="Comincia a scrivere qui..."></textarea>
<div class="pulsanti">
<button id="salva" type="button">Salva bozza</button>
<button id="immagineBtn" type="button">Inserisci immagine</button>
<input id="immagineFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>
<button id="anteprimaBtn" type="button">Anteprima</button>
<button id="pubblicaBtn" type="button">Pubblica articolo</button>
</div>
<p id="stato" class="nota" role="status" aria-live="polite">Bozza salvata soltanto in questo browser. Nessun articolo viene pubblicato.</p>
<div id="anteprima" hidden style="margin-top:35px;border-top:1px solid #d6d0c9;padding-top:25px">
<h2 id="anteprimaTitolo"></h2>
<p id="anteprimaCategoria" style="text-align:center;font-style:italic"></p>
<div id="anteprimaCopertina"></div>
<div id="anteprimaTesto" style="font-size:22px;line-height:1.6;white-space:pre-wrap;overflow-wrap:anywhere"></div>
<div id="anteprimaImmagini"></div>
</div>
</section>
</main>
<footer>✧ La bellezza delle crepe ✧</footer>

<script>
(() => {
  const key = "crepe-scrittoio-web-bozza-v1";
  const titolo = document.getElementById("titolo");
  const categoria = document.getElementById("categoria");
  const testo = document.getElementById("testo");
  const stato = document.getElementById("stato");
  const anteprima = document.getElementById("anteprima");
  function salva() {
    try {
      localStorage.setItem(key, JSON.stringify({
        titolo: titolo.value, categoria: categoria.value, testo: testo.value
      }));
      stato.textContent = "Bozza salvata in questo browser. ♡";
    } catch {
      stato.textContent = "Impossibile salvare la bozza. Controlla lo spazio disponibile.";
    }
  }
  try {
    const d = JSON.parse(localStorage.getItem(key) || "null");
    if (d) {
      titolo.value = d.titolo || "";
      categoria.value = d.categoria || "Pensieri";
      testo.value = d.testo || "";
    }
  } catch {}

  const copertinaInput = document.getElementById("copertina");
  const immagineInput = document.getElementById("immagineFile");

  // Prepara il testo nel formato Markdown usato dal blog.
  // I file dovranno essere caricati prima della pubblicazione.
  function preparaTestoPerBlog() {
    return testo.value.replace(/\[foto:(\d+)\]/g, (riferimento, numero) => {
      const foto = immagini[Number(numero) - 1];
      if (!foto || !foto.percorsoPubblicato) return riferimento;
      return "![Fotografia](" + foto.percorsoPubblicato + ")";
    });
  }


  function apriArchivioImmagini() {
    return new Promise((resolve, reject) => {
      const richiesta = indexedDB.open("crepe-scrittoio-immagini", 1);

      richiesta.onupgradeneeded = () => {
        const db = richiesta.result;
        if (!db.objectStoreNames.contains("foto")) {
          db.createObjectStore("foto");
        }
      };

      richiesta.onsuccess = () => resolve(richiesta.result);
      richiesta.onerror = () => reject(richiesta.error);
    });
  }

  async function salvaImmagineLocale(chiave, file) {
    const db = await apriArchivioImmagini();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("foto", "readwrite");
      tx.objectStore("foto").put(file, chiave);
      tx.oncomplete = () => { db.close(); resolve(); };
      tx.onerror = () => { db.close(); reject(tx.error); };
      tx.onabort = () => { db.close(); reject(tx.error); };
    });
  }

  async function leggiImmagineLocale(chiave) {
    const db = await apriArchivioImmagini();
    return new Promise((resolve, reject) => {
      const tx = db.transaction("foto", "readonly");
      const richiesta = tx.objectStore("foto").get(chiave);
      richiesta.onsuccess = () => resolve(richiesta.result || null);
      richiesta.onerror = () => reject(richiesta.error);
      tx.oncomplete = () => db.close();
      tx.onerror = () => { db.close(); reject(tx.error); };
    });
  }


  // Crea il documento Markdown compatibile con Pages CMS.
  function preparaArticoloMarkdown(percorsoCopertina = "") {
    const oggi = new Date();
    const data = [
      oggi.getFullYear(),
      String(oggi.getMonth() + 1).padStart(2, "0"),
      String(oggi.getDate()).padStart(2, "0")
    ].join("-");

    const sicuro = valore => String(valore || "")
      .replace(/\\/g, "\\\\")
      .replace(/"/g, '\\"')
      .replace(/\r?\n/g, " ");

    const titoloArticolo = titolo.value.trim();
    if (!titoloArticolo) {
      throw new Error("Inserisci un titolo prima di preparare l'articolo.");
    }

    const copertina = percorsoCopertina;
    const corpo = preparaTestoPerBlog();

    return [
      "---",
      'title: "' + sicuro(titoloArticolo) + '"',
      'date: "' + data + '"',
      'category: "' + sicuro(categoria.value) + '"',
      'cover: "' + copertina + '"',
      "---",
      "",
      corpo,
      ""
    ].join("\n");
  }


  // Verifica che l'articolo sia pronto per la pubblicazione.
  function verificaArticolo() {
    const problemi = [];

    if (!titolo.value.trim()) {
      problemi.push("Manca il titolo.");
    }

    if (!testo.value.trim()) {
      problemi.push("Manca il testo.");
    }

    if (!copertinaURL) {
      problemi.push("Manca l'immagine di copertina.");
    }

    const riferimenti = [...testo.value.matchAll(/\[foto:(\d+)\]/g)];

    for (const riferimento of riferimenti) {
      const numero = Number(riferimento[1]);
      const foto = immagini[numero - 1];

      if (!foto || !foto.file) {
        problemi.push("La fotografia " + numero + " non è disponibile.");
      }
    }

    return problemi;
  }

  const immagini = [];
  let copertinaURL = null;
  let recuperoCompletato = false;

  function mostraFoto(contenitore, url) {
    contenitore.replaceChildren();
    if (!url) return;
    const img = document.createElement("img");
    img.src = url;
    img.alt = "Immagine selezionata";
    img.style.cssText = "max-width:100%;height:auto;border-radius:9px;margin:12px 0";
    contenitore.appendChild(img);
  }

  async function recuperaFotografie() {
    try {
      const copertina = await leggiImmagineLocale("bozza-copertina");
      if (copertina) {
        copertinaURL = URL.createObjectURL(copertina);
        mostraFoto(document.getElementById("copertinaPreview"), copertinaURL);
      }

      const elenco = await leggiImmagineLocale("bozza-foto") || [];
      for (const file of elenco) {
        immagini.push({file, url: URL.createObjectURL(file)});
      }
    } catch (errore) {
      stato.textContent = "Impossibile recuperare alcune fotografie della bozza.";
      console.error(errore);
    } finally {
      recuperoCompletato = true;
    }
  }

  const recuperoInCorso = recuperaFotografie();
  window.scrittoioFotoPronte = recuperoInCorso;

  copertinaInput.addEventListener("change", async () => {
    const file = copertinaInput.files[0];
    if (copertinaURL) URL.revokeObjectURL(copertinaURL);
    copertinaURL = file ? URL.createObjectURL(file) : null;
    mostraFoto(document.getElementById("copertinaPreview"), copertinaURL);

    try {
      await salvaImmagineLocale("bozza-copertina", file || null);
      stato.textContent = file
        ? "Copertina salvata nella bozza locale."
        : "Copertina rimossa dalla bozza.";
    } catch (errore) {
      stato.textContent = "Errore nel salvataggio della copertina.";
      console.error(errore);
    }
  });

  document.getElementById("immagineBtn").addEventListener("click", () => immagineInput.click());

  immagineInput.addEventListener("change", async () => {
    const file = immagineInput.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    immagini.push({file, url});

    const riferimento = "[foto:" + immagini.length + "]";
    const posizione = testo.selectionStart;
    testo.setRangeText("\n" + riferimento + "\n", posizione, testo.selectionEnd, "end");
    testo.dispatchEvent(new Event("input", {bubbles:true}));

    try {
      await salvaImmagineLocale("bozza-foto", immagini.map(item => item.file));
      stato.textContent = "Fotografia inserita e salvata nella bozza locale.";
    } catch (errore) {
      stato.textContent = "Fotografia inserita, ma non salvata nell'archivio.";
      console.error(errore);
    }

    immagineInput.value = "";
  });

  let attesa;
  window.scrittoioPulisciDopoPubblicazione = () => {
    clearTimeout(attesa);
    if (copertinaURL) URL.revokeObjectURL(copertinaURL);
    copertinaURL = null;
    immagini.forEach(item => URL.revokeObjectURL(item.url));
    immagini.length = 0;
  };
  [titolo, categoria, testo].forEach(el => el.addEventListener("input", () => {
    clearTimeout(attesa);
    attesa = setTimeout(salva, 700);
  }));
  document.getElementById("salva").addEventListener("click", salva);
  document.getElementById("anteprimaBtn").addEventListener("click", () => {
    document.getElementById("anteprimaTitolo").textContent = titolo.value || "Senza titolo";
    document.getElementById("anteprimaCategoria").textContent = categoria.value;
    const area = document.getElementById("anteprimaTesto");
    area.replaceChildren();
    const parti = (testo.value || "Ancora nessuna parola...").split(/(\[foto:\d+\])/g);
    parti.forEach(parte => {
      const match = parte.match(/^\[foto:(\d+)\]$/);
      if (match) {
        const item = immagini[Number(match[1]) - 1];
        if (item) {
          const img = document.createElement("img");
          img.src = item.url;
          img.alt = "Fotografia dell'articolo";
          img.style.cssText = "display:block;max-width:100%;height:auto;border-radius:9px;margin:20px auto";
          area.appendChild(img);
        } else {
          const avviso = document.createElement("span");
          avviso.textContent = "[Fotografia da selezionare nuovamente]";
          area.appendChild(avviso);
        }
      } else {
        area.appendChild(document.createTextNode(parte));
      }
    });
    mostraFoto(document.getElementById("anteprimaCopertina"), copertinaURL);
    const galleria = document.getElementById("anteprimaImmagini");
    galleria.replaceChildren();
    // Le immagini sono già mostrate nella posizione corretta del testo.
    anteprima.hidden = !anteprima.hidden;
    if (!anteprima.hidden) anteprima.scrollIntoView({behavior:"smooth",block:"start"});
  });
})();
</script>

<div id="areaAccessoGithub" style="max-width:600px;margin:24px auto;padding:0 18px;text-align:center">
  <label for="tokenGithub" style="font-size:20px">Accesso GitHub per pubblicare</label>
  <input id="tokenGithub" type="password" autocomplete="off" spellcheck="false"
    placeholder="Incolla qui il token GitHub" aria-label="Token GitHub">
  <div class="pulsanti" style="margin-top:12px">
    <button id="collegaGithub" type="button">Collega GitHub</button>
    <button id="scollegaGithub" type="button">Disconnetti</button>
  </div>
  <p id="statoGithub" role="status" aria-live="polite" style="font-size:17px"></p>
  <p class="nota">Il token resta soltanto nella scheda del browser. Non inserirlo nel codice del sito.</p>
</div>
<script id="scriptAccessoGithub">
(() => {
  const OWNER = "LaBellezzaDelleCrepe";
  const REPO = "labellezzadellecrepe";
  const BRANCH = "main";
  const TOKEN_KEY = "scrittoio-token-temporaneo";
  const campo = document.getElementById("tokenGithub");
  const stato = document.getElementById("statoGithub");
  const collega = document.getElementById("collegaGithub");
  const scollega = document.getElementById("scollegaGithub");
  const pubblica = document.getElementById("pubblicaBtn");
  let token = sessionStorage.getItem(TOKEN_KEY) || "";
  let occupato = false;

  async function api(path, options = {}) {
    if (!token) throw new Error("Collega prima GitHub.");
    let risposta;
    try {
      risposta = await fetch("https://api.github.com" + path, {
        ...options,
        headers: {
          "Authorization": "Bearer " + token,
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          ...(options.headers || {})
        },
        cache: "no-store"
      });
    } catch {
      throw new Error("Connessione a GitHub non riuscita. Controlla la rete.");
    }
    const data = await risposta.json().catch(() => ({}));
    if (!risposta.ok) {
      const motivo = risposta.status === 401 ? "Token non valido o scaduto" :
        risposta.status === 403 ? "Permessi insufficienti o limite GitHub raggiunto" :
        risposta.status === 409 || risposta.status === 422 ? "File già esistente o conflitto GitHub" :
        (data.message || "Errore GitHub");
      throw new Error(motivo + " (" + risposta.status + ")");
    }
    return data;
  }

  async function verificaToken() {
    const utente = await api("/user");
    if (utente.login?.toLowerCase() !== OWNER.toLowerCase()) {
      throw new Error("Questo token non appartiene all'account del blog.");
    }
    const repo = await api(`/repos/${OWNER}/${REPO}`);
    if (!repo.permissions?.push) throw new Error("Il token non può scrivere nel repository.");
    stato.textContent = "GitHub collegato: " + utente.login + " ♡";
  }

  collega.addEventListener("click", async () => {
    if (occupato) return;
    const candidato = campo.value.trim();
    if (!candidato && !token) {
      stato.textContent = "Incolla il token per collegarti.";
      return;
    }
    const precedente = token;
    token = candidato || token;
    collega.disabled = true;
    stato.textContent = "Verifico l'accesso...";
    try {
      await verificaToken();
      sessionStorage.setItem(TOKEN_KEY, token);
      campo.value = "";
    } catch (errore) {
      token = precedente;
      stato.textContent = errore.message;
    } finally {
      collega.disabled = false;
    }
  });

  scollega.addEventListener("click", () => {
    if (occupato) return;
    token = "";
    campo.value = "";
    sessionStorage.removeItem(TOKEN_KEY);
    stato.textContent = "GitHub disconnesso.";
  });

  function toBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result).split(",")[1]);
      reader.onerror = () => reject(new Error("Impossibile leggere l'immagine."));
      reader.readAsDataURL(blob);
    });
  }

  function estensione(file) {
    const tipi = {"image/jpeg":"jpg", "image/png":"png", "image/webp":"webp"};
    const ext = tipi[file?.type];
    if (!ext) throw new Error("Sono ammesse solo immagini JPG, PNG o WebP.");
    if (file.size > 8 * 1024 * 1024) {
      throw new Error("Una fotografia supera 8 MB. Riducila prima di pubblicare.");
    }
    return ext;
  }

  async function creaFile(percorso, base64, messaggio) {
    const path = percorso.split("/").map(encodeURIComponent).join("/");
    return api(`/repos/${OWNER}/${REPO}/contents/${path}`, {
      method: "PUT",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message:messaggio, content:base64, branch:BRANCH})
    });
  }

  pubblica.addEventListener("click", async () => {
    if (occupato) return;
    if (!token) {
      stato.textContent = "Collega GitHub prima di pubblicare.";
      return;
    }
    const titolo = document.getElementById("titolo");
    const testo = document.getElementById("testo");
    const categoria = document.getElementById("categoria");
    const copertina = document.getElementById("copertina");
    const salva = document.getElementById("salva");
    const inserisci = document.getElementById("immagineBtn");
    const anteprima = document.getElementById("anteprimaBtn");
    const statoBozza = document.getElementById("stato");
    if (!titolo.value.trim() || !testo.value.trim()) {
      statoBozza.textContent = "Inserisci titolo e testo prima di pubblicare.";
      return;
    }
    if (!confirm("Pubblicare questo articolo sul blog?")) return;
    occupato = true;
    const controlli = [titolo, testo, categoria, copertina, salva, inserisci, anteprima, pubblica, collega, scollega];
    controlli.forEach(el => el.disabled = true);
    let articoloCreato = false;
    try {
      // Aspettiamo il ripristino delle foto dalla bozza.
      await window.scrittoioFotoPronte;
      const db = await new Promise((resolve, reject) => {
        const req = indexedDB.open("crepe-scrittoio-immagini", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("foto");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      const leggi = chiave => new Promise((resolve, reject) => {
        const tx = db.transaction("foto", "readonly");
        const req = tx.objectStore("foto").get(chiave);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      const fileCopertina = await leggi("bozza-copertina");
      const foto = await leggi("bozza-foto") || [];
      db.close();
      if (!fileCopertina) throw new Error("Manca la copertina della bozza.");
      const riferimenti = [...testo.value.matchAll(/\[foto:(\d+)\]/g)];
      const indici = [...new Set(riferimenti.map(m => Number(m[1]) - 1))];
      for (const indice of indici) {
        if (!foto[indice]) throw new Error("Manca la fotografia " + (indice + 1));
      }
      const uid = new Date().toISOString().replace(/[-:.TZ]/g, "").slice(0,14) + "-" +
        crypto.randomUUID().slice(0,8);
      const nome = titolo.value.trim().normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g, "").slice(0,55) || "articolo";
      const percorsoCopertina = `images/${uid}-copertina.${estensione(fileCopertina)}`;
      statoBozza.textContent = "Carico la copertina...";
      await creaFile(percorsoCopertina, await toBase64(fileCopertina), "Aggiungi copertina " + nome);
      const percorsi = new Map();
      for (const indice of indici) {
        const file = foto[indice];
        const percorso = `images/${uid}-foto-${indice+1}.${estensione(file)}`;
        statoBozza.textContent = `Carico la fotografia ${indice+1}...`;
        await creaFile(percorso, await toBase64(file), "Aggiungi fotografia " + nome);
        percorsi.set(indice+1, percorso);
      }
      const data = new Date();
      const giorno = [data.getFullYear(), String(data.getMonth()+1).padStart(2,"0"),
        String(data.getDate()).padStart(2,"0")].join("-");
      const yaml = value => JSON.stringify(String(value).replace(/\r?\n/g," "));
      const corpo = testo.value.replace(/\[foto:(\d+)\]/g,
        (match, numero) => `![Fotografia](${percorsi.get(Number(numero))})`);
      const markdown = ["---", "title: " + yaml(titolo.value.trim()),
        "date: " + yaml(giorno), "category: " + yaml(categoria.value),
        "cover: " + yaml(percorsoCopertina), "---", "", corpo, ""].join("\n");
      const bytes = new TextEncoder().encode(markdown);
      let bin = "";
      for (const byte of bytes) bin += String.fromCharCode(byte);
      const base64 = btoa(bin);
      statoBozza.textContent = "Pubblico l'articolo...";
      await creaFile(`contenuti/post/${giorno}-${nome}-${uid}.md`, base64, "Pubblica articolo " + nome);
      articoloCreato = true;
      // La conferma riguarda GitHub. La comparsa sul blog dipende dalla sua build.
      localStorage.removeItem("crepe-scrittoio-web-bozza-v1");
      const pulisci = await new Promise((resolve, reject) => {
        const req = indexedDB.open("crepe-scrittoio-immagini", 1);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
      await new Promise((resolve, reject) => {
        const tx = pulisci.transaction("foto", "readwrite");
        tx.objectStore("foto").delete("bozza-copertina");
        tx.objectStore("foto").delete("bozza-foto");
        tx.oncomplete = resolve;
        tx.onerror = () => reject(tx.error);
      });
      pulisci.close();
      window.scrittoioPulisciDopoPubblicazione?.();
      titolo.value = "";
      testo.value = "";
      categoria.selectedIndex = 0;
      copertina.value = "";
      document.getElementById("copertinaPreview").replaceChildren();
      document.getElementById("anteprima").hidden = true;
      statoBozza.textContent = "Articolo inviato a GitHub! ♡ Il blog si aggiornerà dopo la pubblicazione automatica.";
    } catch (errore) {
      statoBozza.textContent = articoloCreato
        ? "Articolo creato su GitHub, ma non ho potuto pulire la bozza: " + errore.message
        : "Pubblicazione non completata: " + errore.message + ". La bozza è conservata.";
    } finally {
      occupato = false;
      controlli.forEach(el => el.disabled = false);
    }
  });

  if (token) {
    verificaToken().catch(errore => {
      stato.textContent = errore.message;
      token = "";
      sessionStorage.removeItem(TOKEN_KEY);
    });
  }
})();
</script>

</body>
</html>
