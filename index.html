<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f8f4ec">
<meta name="description" content="La bellezza delle crepe, un diario di pensieri, parole e illustrazioni.">
<title>La bellezza delle crepe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f8f4ec;
  --ink:#514237;
  --sage:#89977d;
  --line:#ddd5c8;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:"Cormorant Garamond",serif;
}
header{
  position:relative;
  text-align:center;
  padding:85px 20px 35px;
  overflow:hidden;
}
header h1{
  font-family:"Great Vibes",cursive;
  font-size:clamp(49px,8vw,92px);
  font-weight:400;
  line-height:1.3;
  margin:12px 0;
}
.subtitle{
  font-size: 16.2px;
  font-style:italic;
  letter-spacing:1px;
}
.botanical{
  position:absolute;
  width:175px;
  opacity:.85;
  pointer-events:none;
}
.left{top:8px;left:-35px}
.right{
  top:18px;
  right:-35px;
  transform:scaleX(-1);
}
nav{
  display:flex;
  justify-content:center;
  gap:32px;
  padding:19px;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}
nav a{
  color:var(--ink);
  text-decoration:none;
  font-size: 17.1px;
}
nav a:hover{color:var(--sage)}
main{
  max-width:850px;
  margin:65px auto;
  padding:0 22px;
}
.intro{
  text-align:center;
  font-size: 20.7px;
  font-style:italic;
  margin-bottom:65px;
}
article{
  margin-bottom:75px;
  padding-bottom:45px;
  border-bottom:1px solid var(--line);
}
article .date{
  font:11px "DM Sans",sans-serif;
  letter-spacing:2px;
  color:#8b8175;
  text-transform:uppercase;
}
article h2{
  font-size:clamp(32px,5vw,47px);
  font-weight:500;
  margin:14px 0 20px;
}
.artwork{
  width:100%;
  min-height:240px;
  aspect-ratio:16/9;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#ebe5da;
  color:#8a857b;
  font-style:italic;
  font-size: 18px;
  text-align:center;
  margin:22px 0;
}
article p{
  font-size: 19.8px;
  line-height:1.65;
}
.read-more{
  display:inline-block;
  color:var(--ink);
  font-size: 16.2px;
  text-decoration:none;
  border-bottom:1px solid var(--sage);
  padding-bottom:5px;
}
footer{
  text-align:center;
  padding:50px 20px;
  color:#84776a;
  font-size: 15.3px;
}
@media(max-width:600px){
  header{padding:75px 15px 30px}
  .botanical{width:125px}
  nav{gap:22px}
  main{margin:45px auto}
  .intro{font-size: 18px}
  article p{font-size: 18px}
}
</style>

<style>
@media screen and (max-width: 600px) {
  header { padding-top: 30px !important; padding-bottom: 22px !important; }
  header h1 { font-size: 38.7px !important; line-height: 1.15 !important; }
  header p { font-size: 14.4px !important; margin-top: 8px !important; }
  nav { padding-top: 10px !important; padding-bottom: 10px !important; }
  nav a { font-size: 15.3px !important; }
  main { margin-top: 25px !important; padding-left: 19px !important; padding-right: 19px !important; }
  h1 { line-height: 1.2 !important; }
  h2 { font-size: 27px !important; line-height: 1.2 !important; }
  p { font-size: 16.2px !important; line-height: 1.5 !important; }
  article { margin-bottom: 35px !important; }
  .intro { margin-bottom: 30px !important; }
  .artwork { margin-top: 18px !important; margin-bottom: 18px !important; }
  .content p { margin-bottom: 16px !important; }
}
</style>

  </div>

  La bellezza delle crepe · Un diario personale
  <p>© 2026</p>
</footer>


<script>
const mesi = [
  "gennaio","febbraio","marzo","aprile","maggio","giugno",
  "luglio","agosto","settembre","ottobre","novembre","dicembre"
];

function dataItaliana(data) {
  const [anno, mese, giorno] = data.split("-").map(Number);
  return `${giorno} ${mesi[mese - 1]} ${anno}`;
}

function creaElemento(tag, classe, testo) {
  const elemento = document.createElement(tag);
  if (classe) elemento.className = classe;
  if (testo !== undefined) elemento.textContent = testo;
  return elemento;
}

async function caricaArticoli() {
  const contenitore = document.getElementById("articoli");

  try {
    const risposta = await fetch("contenuti/articoli.json", {
      cache: "no-store"
    });

    if (!risposta.ok) throw new Error("Archivio non disponibile");

    const articoli = await risposta.json();
    articoli.sort((a, b) => b.data.localeCompare(a.data));

    contenitore.replaceChildren();

    if (articoli.length === 0) {
      contenitore.append(
        creaElemento("p", "intro", "Qui nasceranno nuovi pensieri.")
      );
      return;
    }

    for (const articolo of articoli) {
      const scheda = creaElemento("article");

      const data = creaElemento(
        "div",
        "date",
        `${dataItaliana(articolo.data)} · ${articolo.categoria || "Diario"}`
      );

      const titolo = creaElemento("h2", "", articolo.titolo);

      const copertina = creaElemento("div", "artwork");

      if (articolo.copertina) {
        const immagine = document.createElement("img");
        immagine.src = articolo.copertina;
        immagine.alt = articolo.titolo;
        immagine.style.cssText =
          "width:100%;height:100%;object-fit:cover";
        copertina.append(immagine);
      } else {
        copertina.textContent = "Qui nascerà la tua illustrazione.";
      }

      const estratto = creaElemento("p", "", articolo.estratto);

      const collegamento = creaElemento(
        "a",
        "read-more",
        "Continua a leggere"
      );
      collegamento.href =
        "articoli/leggi.html?id=" + encodeURIComponent(articolo.id);

      scheda.append(data, titolo, copertina, estratto, collegamento);
      contenitore.append(scheda);
    }
  } catch (errore) {
    contenitore.replaceChildren(
      creaElemento(
        "p",
        "intro",
        "Non è stato possibile caricare gli articoli."
      )
    );
  }
}

caricaArticoli();
</script>
