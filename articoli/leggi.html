  --ink:#514237;

  --line:#ddd5c8;
}
*{box-sizing:border-box}

  background:var(--paper);

  font-family:"Cormorant Garamond",serif;
}

  padding:45px 20px 25px;
}

  color:var(--ink);

}

  font-weight:500;
  text-align:center;
  line-height:1.15;
  margin:20px 0 35px;
}
.ornament{
  text-align:center;
  color:var(--sage);
  font-size:25px;
  margin-bottom:35px;
}
.artwork{
  width:100%;
  aspect-ratio:16/9;
  background:#ebe5da;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#8a857b;
  font-style:italic;
  font-size:20px;
  text-align:center;
  padding:20px;
  margin-bottom:45px;
}
.content{
  font-size:23px;
  line-height:1.85;
}
.content p{margin-bottom:28px}
.content p:first-child:first-letter{

  line-height:.9;

  color:#89977d;
}
.end{
  text-align:center;
  color:var(--sage);
  margin:55px 0;
  font-size:23px;
}
.back{
  display:block;
  text-align:center;
  color:var(--ink);
  text-decoration:none;
  font-size:20px;
  margin:35px auto;
}
.back:hover{color:var(--sage)}
footer{
  border-top:1px solid var(--line);
  text-align:center;
  padding:35px 20px;
  color:#84776a;
  font-size:17px;
}
@media(max-width:600px){
  main{margin:40px auto}
  .content{font-size:21px}

<body>

<header>
<a class="site-title" href="../index.html">La bellezza delle crepe</a>

<nav>
<a href="../index.html">Diario</a>
<a href="../archivio.html">Archivio</a>
<a href="../chi-sono.html">Chi sono</a>
</nav>


<main>
  <div class="date" id="data-articolo"></div>
  <h1 id="titolo-articolo"></h1>
  <div class="ornament">❀ ─── ❀</div>
  <div class="artwork" id="copertina-articolo"></div>
  <div class="content" id="testo-articolo"></div>
  <div class="end">❀</div>
  <a class="back" href="../index.html">← Torna al diario</a>
</main>


<footer>
La bellezza delle crepe · Un diario personale
</footer>


<script>
const mesi = [
  "gennaio","febbraio","marzo","aprile","maggio","giugno",
  "luglio","agosto","settembre","ottobre","novembre","dicembre"
];

async function mostraArticolo() {
  const contenitore = document.getElementById("testo-articolo");

  try {
    const risposta = await fetch("../contenuti/articoli.json", {
      cache: "no-store"
    });
    if (!risposta.ok) throw new Error("Archivio non disponibile");

    const articoli = await risposta.json();
    const parametri = new URLSearchParams(location.search);
    const id = parametri.get("id");
    const articolo = articoli.find(a => a.id === id);

    if (!articolo) throw new Error("Articolo non trovato");

    document.title = articolo.titolo + " | La bellezza delle crepe";

    const [anno, mese, giorno] = articolo.data.split("-");

    document.getElementById("data-articolo").textContent =
      Number(giorno) + " " + mesi[Number(mese)-1] + " " +
      anno + " · " + (articolo.categoria || "Diario");

    document.getElementById("titolo-articolo").textContent =
      articolo.titolo;

    const copertina = document.getElementById("copertina-articolo");

    if (articolo.copertina) {
      const img = document.createElement("img");
      img.src = "../" + articolo.copertina.replace(/^\/+/, "");
      img.alt = articolo.titolo;
      img.style.cssText = "width:100%;height:100%;object-fit:cover";
      copertina.append(img);
    } else {
      copertina.textContent = "Qui inseriremo l'illustrazione dell'articolo.";
    }

    for (const paragrafo of articolo.contenuto || []) {
      const parti = paragrafo.split(/(!\\[[^\\]]*\\]\\([^)]+\\))/g);

      for (const parte of parti) {
        if (!parte.trim()) continue;

        const immagine = parte.match(/^!\\[([^\\]]*)\\]\\(([^)]+)\\)$/);

        if (immagine) {
          const img = document.createElement("img");
          const percorso = immagine[2].trim();

          if (!percorso.startsWith("http:") &&
              !percorso.startsWith("https:") &&
              !percorso.startsWith("data:") &&
              !percorso.startsWith("javascript:")) {
            img.src = "../" + percorso.replace(/^\\/+/, "");
            img.alt = immagine[1];
            img.style.cssText =
              "display:block;width:100%;height:auto;margin:30px auto;border-radius:4px";
            contenitore.append(img);
          }
        } else {
          const p = document.createElement("p");
          p.textContent = parte;
          contenitore.append(p);
        }
      }
    }

  } catch (errore) {
    contenitore.textContent =
      "Questo articolo non è disponibile.";
  }
}

mostraArticolo();
</script>
