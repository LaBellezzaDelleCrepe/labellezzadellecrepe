name: Aggiorna articoli del blog

on:
  push:
    branches: [main]
    paths:
      - 'contenuti/post/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Aggiorna biblioteca
        run: python scripts/aggiorna_articoli.py

      - name: Salva aggiornamenti
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contenuti/articoli.json
          if ! git diff --cached --quiet; then
            git commit -m "Aggiorna articoli pubblicati"
            git push
          fi
